name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mesh,viz]"
      - name: Lint with ruff (incluye scripts/ y tests/)
        run: |
          ruff check . --output-format=full
      - name: Verify README image exists
        run: |
          test -f assets/readme_banner.png || (echo "Banner no generado"; exit 1)
      - name: Test with pytest (tests con argumentos por nombre)
        run: pytest -q tests/
