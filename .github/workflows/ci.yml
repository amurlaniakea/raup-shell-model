name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (sin extras de malla)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Tipos con mypy
        run: mypy src
      - name: Tests sin trimesh (los de malla se omiten)
        run: pytest -q
      - name: Tests con trimesh y matplotlib
        run: |
          pip install -e ".[mesh,viz]"
          pytest -q
